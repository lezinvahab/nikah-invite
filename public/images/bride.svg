<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#F2DCDA"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- soft arch -->
  <path d="M200 62 a148 148 0 0 1 148 148 v210 h-296 v-210 a148 148 0 0 1 148-148 z" fill="#FFFFFF" opacity="0.45"/>
  <path d="M200 76 a134 134 0 0 1 134 134 v200 h-268 v-200 a134 134 0 0 1 134-134 z" fill="none" stroke="#AC6C71" stroke-width="1.4" opacity="0.55"/>

  <!-- small crescent -->
  <path d="M200 104 a16 16 0 1 0 0 32 a12.5 12.5 0 1 1 0 -32 z" fill="#B99D6C" opacity="0.8"/>

  <!-- monogram -->
  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="168" fill="#AC6C71" opacity="0.85" font-weight="500">H</text>

  <!-- ornament under monogram -->
  <g stroke="#B99D6C" stroke-width="1.3" opacity="0.75" fill="none">
    <path d="M120 340 H162"/>
    <path d="M238 340 H280"/>
    <path d="M172 340 h14 M214 340 h14" stroke-width="0.8" opacity="0.6"/>
  </g>
  <rect x="197" y="337" width="6" height="6" fill="#B99D6C" opacity="0.85" transform="rotate(45 200 340)"/>
</svg>